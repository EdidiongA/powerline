<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Powerline — plan</title>
    <style>
      :root {
        --ink: #16202a; --ink-2: #47566a; --ink-3: #8394a8;
        --charge: #1e9e5a; --sun: #e8a33d; --grid: #4b7bb8; --alarm: #c8452f;
        --rule: rgba(22, 32, 42, .14); --field: rgba(22, 32, 42, .05); --hover: rgba(22, 32, 42, .035);
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #e7edf4; --ink-2: #9fb0c4; --ink-3: #6c7e93;
                --rule: rgba(231,237,244,.16); --field: rgba(231,237,244,.06); --hover: rgba(231,237,244,.05); }
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 14px 14px 12px; background: transparent; color: var(--ink);
             font-family: var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
      .frame { border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; position: relative; }
      .frame.busy { opacity: .55; }
      .frame.busy::after { content: ""; position: absolute; inset: 0; cursor: progress; }

      .head { padding: 14px 16px 12px; }
      .head h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
      .head p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); }

      /* Day ribbon: where the appliances actually land */
      .day { padding: 0 16px 14px; }
      .track { position: relative; height: 30px; background: var(--field); border-radius: 2px; overflow: hidden; }
      .track > .sun { position: absolute; top: 0; bottom: 0; background: var(--sun); opacity: .18; }
      .track > .slot { position: absolute; top: 4px; bottom: 4px; border-radius: 2px; min-width: 3px;
                       transition: left .45s cubic-bezier(.2,.7,.3,1), width .45s cubic-bezier(.2,.7,.3,1), opacity .25s; }
      .axis { display: flex; justify-content: space-between; margin-top: 5px; font-size: 10.5px; color: var(--ink-3); }

      /* Schedule rows */
      .rows { border-top: 1px solid var(--rule); }
      .row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; cursor: pointer;
             border-bottom: 1px solid var(--rule); user-select: none; }
      .row:last-child { border-bottom: 0; }
      .row:hover { background: var(--hover); }
      .row:focus-within { outline: 2px solid var(--grid); outline-offset: -2px; }
      .row input { appearance: none; width: 17px; height: 17px; flex: none; margin: 0; cursor: pointer;
                   border: 1.5px solid var(--ink-3); border-radius: 3px; position: relative; }
      .row input:checked { background: var(--charge); border-color: var(--charge); }
      .row input:checked::after { content: ""; position: absolute; left: 5px; top: 1.5px; width: 4px; height: 9px;
                   border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(42deg); }
      .name { flex: 1; min-width: 0; }
      .name b { display: block; font-size: 14px; font-weight: 550; letter-spacing: -.005em; }
      .name i { font-style: normal; font-size: 11.5px; color: var(--ink-3); }
      .when { font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
      .when.off { font-size: 12.5px; font-weight: 400; color: var(--ink-3); }
      .src { font-size: 11px; color: var(--ink-2); width: 58px; text-align: right; flex: none; }
      .row.unpicked .name b, .row.unpicked .name i { color: var(--ink-3); }

      .foot { display: flex; justify-content: space-between; align-items: baseline;
              padding: 11px 16px 12px; border-top: 1px solid var(--rule); font-size: 12.5px; }
      .foot .low { font-weight: 550; }
      .placeholder { padding: 22px 16px; color: var(--ink-3); font-size: 13px; }
      .status { margin-top: 8px; font-size: 10.5px; color: var(--ink-3); min-height: 13px; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div class="frame" id="root"><div class="placeholder">Working out today's plan…</div></div>
    <div class="status" id="status"></div>
    <script type="module" src="./planner.ts"></script>
  </body>
</html>
