<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Powerline planner</title>
    <style>
      :root { font-family: system-ui, -apple-system, sans-serif; color-scheme: light dark; --ok:#2e9e6a; --warn:#d99a1a; --bad:#d64545; --muted:rgba(127,127,127,.7); --box:rgba(127,127,127,.12); }
      body { margin:0; padding:12px; background:transparent; }
      h2 { margin:0 0 4px; font-size:15px; }
      .sub { font-size:12px; color:var(--muted); margin-bottom:10px; }
      .row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:var(--box); margin-bottom:6px; }
      .row input { width:18px; height:18px; }
      .name { flex:1; font-weight:600; }
      .name small { display:block; font-weight:400; font-size:11px; color:var(--muted); }
      .when { font-variant-numeric:tabular-nums; font-weight:650; min-width:52px; text-align:right; }
      .tag { font-size:11px; padding:2px 7px; border-radius:99px; background:var(--box); color:var(--muted); }
      .tag.sun { background:rgba(242,182,50,.25); color:inherit; }
      .tag.skip { background:rgba(214,69,69,.18); color:inherit; }
      .foot { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:13px; }
      .busy { opacity:.5; pointer-events:none; }
      .timeline { display:grid; grid-template-columns:repeat(24,1fr); gap:2px; margin:10px 0 4px; }
      .timeline > i { height:8px; border-radius:2px; background:var(--box); }
      .timeline > i.sun { background:rgba(242,182,50,.55); }
      .timeline > i.on { background:var(--ok); }
      .ticks { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); }
      .empty { color:var(--muted); font-size:13px; }
    </style>
  </head>
  <body>
    <h2>Today's power plan</h2>
    <div class="sub" id="sub">Tick the appliances you want to run; the plan updates live.</div>
    <div id="root"><div class="empty">Waiting for plan_day…</div></div>
    <script type="module" src="./planner.ts"></script>
  </body>
</html>
